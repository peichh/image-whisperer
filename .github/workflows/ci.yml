name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/test_skill.py
      - run: pip install skills-ref && mkdir -p /tmp/s && cp -r . /tmp/s/image-whisperer && agentskills validate /tmp/s/image-whisperer
